AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infrastructure for the "Deploy Java App Using Elastic Beanstalk" lab.
  Provisions everything the application needs as a single stack: the S3
  bucket for source bundles, the DynamoDB table (external service), the
  EC2 instance role, the GitHub Actions OIDC deploy role, and the Elastic
  Beanstalk application + environment. Designed so the whole lab can be
  created or torn down with one command.

# ---------------------------------------------------------------------------
# Parameters - values you may want to change per account/deployment without
# editing the template body. Sensible defaults match the lab as built.
# ---------------------------------------------------------------------------
Parameters:

  ApplicationName:
    Type: String
    Default: eb-java-app
    Description: Name of the Elastic Beanstalk application.

  EnvironmentName:
    Type: String
    Default: eb-java-app-prod
    Description: Name of the Elastic Beanstalk environment.

  SourceBucketName:
    Type: String
    Description: >
      Globally-unique name for the S3 bucket that stores source bundles.
      Include your account id to keep it unique, e.g.
      eb-java-app-source-047719661196.

  DynamoTableName:
    Type: String
    Default: eb-app-heartbeat
    Description: Name of the DynamoDB table used for the external-service check.

  GitHubOrg:
    Type: String
    Default: 1MuhireDavid
    Description: GitHub user/org that owns the repository.

  GitHubRepo:
    Type: String
    Default: aws-labs
    Description: GitHub repository name (without the org prefix).

  SolutionStackName:
    Type: String
    Default: "64bit Amazon Linux 2023 v4.12.7 running Corretto 17"
    Description: >
      Elastic Beanstalk platform (Java SE / Corretto 17). Confirm the current
      string with: aws elasticbeanstalk list-available-solution-stacks.

  CreateOidcProvider:
    Type: String
    AllowedValues: [ "true", "false" ]
    Default: "false"
    Description: >
      Set to "true" only if the GitHub OIDC provider does NOT already exist in
      the account. An account can have exactly one provider for a given URL, so
      if you created it earlier via CLI, leave this "false" to avoid a clash.

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  ShouldCreateOidcProvider: !Equals [ !Ref CreateOidcProvider, "true" ]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # =========================================================================
  # 1. S3 bucket - stores the versioned application source bundles (zips)
  #    that GitHub Actions uploads and Elastic Beanstalk deploys from.
  # =========================================================================
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SourceBucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: eb-java-app

  # Bucket policy letting the Elastic Beanstalk service read source bundles.
  # Required because this bucket has a custom name (not the auto-created
  # elasticbeanstalk-* bucket that EB can read by default).
  SourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SourceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowElasticBeanstalkServiceAccess
            Effect: Allow
            Principal:
              Service: elasticbeanstalk.amazonaws.com
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:ListBucket
            Resource:
              - !Sub "arn:aws:s3:::${SourceBucketName}"
              - !Sub "arn:aws:s3:::${SourceBucketName}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # =========================================================================
  # 2. DynamoDB table - the "external service" the app writes heartbeats to.
  #    Pay-per-request so it costs nothing when idle.
  # =========================================================================
  HeartbeatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: eb-java-app

  # =========================================================================
  # 3. EC2 instance role - attached to the EB instances so the running app
  #    can reach DynamoDB without any keys in code, plus the standard EB
  #    web-tier permissions.
  # =========================================================================
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "aws-elasticbeanstalk-ec2-role-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWorkerTier
      Policies:
        - PolicyName: dynamodb-heartbeat-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DescribeTable
                Resource: !GetAtt HeartbeatTable.Arn
        - PolicyName: eb-deploy-support
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read the application source bundle from our custom bucket.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "arn:aws:s3:::${SourceBucketName}"
                  - !Sub "arn:aws:s3:::${SourceBucketName}/*"
                  - !Sub "arn:aws:s3:::elasticbeanstalk-${AWS::Region}-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::elasticbeanstalk-${AWS::Region}-${AWS::AccountId}/*"
              # EC2 describe calls EB's instance agent needs during deploy.
              - Effect: Allow
                Action:
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeInstances
                Resource: "*"
      Tags:
        - Key: Project
          Value: eb-java-app


  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "aws-elasticbeanstalk-ec2-role-${EnvironmentName}"
      Roles:
        - !Ref InstanceRole

  # =========================================================================
  # 4. GitHub OIDC provider (optional) - lets GitHub Actions exchange a
  #    short-lived token for AWS credentials, so no static keys are stored.
  #    Only created if CreateOidcProvider=true.
  # =========================================================================
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # =========================================================================
  # 5. GitHub Actions deploy role - assumed via OIDC by the CI/CD pipeline.
  #    Trust policy is scoped to this repo's main branch only.
  # =========================================================================
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "github-actions-eb-deploy-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess-AWSElasticBeanstalk
      Policies:
        - PolicyName: eb-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SourceBundleBucket
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/*"
      Tags:
        - Key: Project
          Value: eb-java-app

  # =========================================================================
  # 6. Elastic Beanstalk service role - EB assumes this to manage the
  #    environment (health monitoring, managed updates).
  # =========================================================================
  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "aws-elasticbeanstalk-service-role-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticbeanstalk.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkManagedUpdatesCustomerRolePolicy
        - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkService
      Tags:
        - Key: Project
          Value: eb-java-app

  # =========================================================================
  # 7. Elastic Beanstalk application - the container for versioned releases.
  # =========================================================================
  BeanstalkApplication:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: !Ref ApplicationName
      Description: Java Spring Boot app deployed via CI/CD.

  # =========================================================================
  # 8. Elastic Beanstalk environment - the running infrastructure (load
  #    balancer, auto scaling group, EC2). EB provisions and manages all of
  #    it; no EC2 is defined by hand here.
  # =========================================================================
  BeanstalkEnvironment:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      ApplicationName: !Ref BeanstalkApplication
      EnvironmentName: !Ref EnvironmentName
      SolutionStackName: !Ref SolutionStackName
      OptionSettings:
        # Attach the instance profile so the app can reach DynamoDB.
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: IamInstanceProfile
          Value: !Ref InstanceProfile
        # EB service role for health/managed updates.
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: ServiceRole
          Value: !Ref ServiceRole
        - Namespace: aws:elasticbeanstalk:managedactions
          OptionName: ManagedActionsEnabled
          Value: "true"
        - Namespace: aws:elasticbeanstalk:managedactions
          OptionName: PreferredStartTime
          Value: "Sun:02:00"
        - Namespace: aws:elasticbeanstalk:managedactions:platformupdate
          OptionName: UpdateLevel
          Value: minor
        # Load-balanced => provisions the ALB + auto scaling group.
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: EnvironmentType
          Value: LoadBalanced
        # Enhanced health reporting.
        - Namespace: aws:elasticbeanstalk:healthreporting:system
          OptionName: SystemType
          Value: enhanced
        # Rolling deployments in 50% batches for safe releases.
        - Namespace: aws:elasticbeanstalk:command
          OptionName: DeploymentPolicy
          Value: Rolling
        - Namespace: aws:elasticbeanstalk:command
          OptionName: BatchSizeType
          Value: Percentage
        - Namespace: aws:elasticbeanstalk:command
          OptionName: BatchSize
          Value: "50"
        # Application environment variables (external-service config).
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: DYNAMODB_TABLE_NAME
          Value: !Ref DynamoTableName
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: AWS_REGION
          Value: !Ref AWS::Region
      Tags:
        - Key: Project
          Value: eb-java-app

# ---------------------------------------------------------------------------
# Outputs - handy values printed after the stack finishes.
# ---------------------------------------------------------------------------
Outputs:

  EnvironmentName:
    Description: >
      EB environment name. Get the public URL with:
      aws elasticbeanstalk describe-environments --environment-names <name>
      --query "Environments[0].CNAME" --output text
    Value: !Ref BeanstalkEnvironment

  SourceBucket:
    Description: S3 bucket for source bundles (set as EB_SOURCE_BUCKET in GitHub).
    Value: !Ref SourceBucket

  DeployRoleArn:
    Description: IAM role ARN for GitHub Actions (set as AWS_DEPLOY_ROLE_ARN secret).
    Value: !GetAtt GitHubDeployRole.Arn

  DynamoTable:
    Description: DynamoDB table name (also injected as an EB env var).
    Value: !Ref HeartbeatTable