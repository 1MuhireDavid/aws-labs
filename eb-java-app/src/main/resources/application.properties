spring.application.name=eb-java-app

# Elastic Beanstalk (Java SE platform) proxies traffic to whatever port
# is provided in the PORT environment variable, defaulting to 5000 locally.
server.port=${PORT:5000}

# Populated at build time by Maven resource filtering (see pom.xml).
app.build.version=@project.version@

# Actuator - expose only what's needed for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# DynamoDB integration (optional challenge) - all values supplied via
# Elastic Beanstalk environment variables, never hard-coded.
app.aws.region=${AWS_REGION:eu-north-1}
app.dynamodb.table-name=${DYNAMODB_TABLE_NAME:}
