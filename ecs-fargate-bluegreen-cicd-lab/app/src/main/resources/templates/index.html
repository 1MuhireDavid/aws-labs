<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${labName}">ECS Blue/Green Lab</title>
  <style>
    :root {
      --blueprint: #16324a;
      --blueprint-deep: #0e2436;
      --grid-line: rgba(210, 230, 245, 0.08);
      --ink: #eaf2f8;
      --ink-muted: #8fa9bd;
      --safety: #ff6b35;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background-color: var(--blueprint);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: "IBM Plex Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet {
      position: relative;
      width: min(560px, 92vw);
      border: 1.5px solid rgba(234, 242, 248, 0.35);
      background: rgba(14, 36, 54, 0.55);
      backdrop-filter: blur(2px);
      padding: 0;
    }

    /* corner crosshairs, a real drafting convention */
    .sheet::before, .sheet::after,
    .crosshair-tr, .crosshair-bl {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: rgba(234, 242, 248, 0.55);
      border-style: solid;
    }
    .sheet::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .sheet::after   { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
    .crosshair-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .crosshair-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }

    .sheet-header {
      padding: 22px 28px 16px;
      border-bottom: 1px solid rgba(234, 242, 248, 0.25);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .lab-name {
      margin: 6px 0 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .title-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .cell {
      padding: 16px 28px;
      border-right: 1px solid rgba(234, 242, 248, 0.15);
      border-bottom: 1px solid rgba(234, 242, 248, 0.15);
    }
    .cell:nth-child(2n) { border-right: none; }

    .cell .label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 6px;
    }

    .cell .value {
      font-size: 15px;
      margin: 0;
      word-break: break-word;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 28px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--safety);
      box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.6);
      animation: pulse 2.2s ease-out infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.55); }
      70%  { box-shadow: 0 0 0 9px rgba(255, 107, 53, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0); }
    }

    .status-text {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--safety);
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot { animation: none; }
    }

    @media (max-width: 480px) {
      .title-block { grid-template-columns: 1fr; }
      .cell:nth-child(2n) { border-right: 1px solid rgba(234, 242, 248, 0.15); }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <span class="crosshair-tr" aria-hidden="true"></span>
    <span class="crosshair-bl" aria-hidden="true"></span>

    <div class="sheet-header">
      <p class="eyebrow">AWS &middot; ECS Fargate &middot; Blue/Green Deployment</p>
      <h1 class="lab-name" th:text="${labName}">Lab Name</h1>
    </div>

    <div class="title-block">
      <div class="cell">
        <p class="label">Drawn by</p>
        <p class="value" th:text="${ownerName}">Full Name</p>
      </div>
      <div class="cell">
        <p class="label">Revision</p>
        <p class="value" th:text="${appVersion}">local-dev</p>
      </div>
      <div class="cell">
        <p class="label">Serving task</p>
        <p class="value" th:text="${hostname}">task-hostname</p>
      </div>
      <div class="cell">
        <p class="label">Compute</p>
        <p class="value">Fargate (private subnet)</p>
      </div>
    </div>

    <div class="status-row">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-text">Healthy &middot; behind Application Load Balancer</span>
    </div>
  </main>
</body>
</html>
