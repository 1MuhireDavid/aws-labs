# CloudFormation Git sync "deployment file" for the BOOTSTRAP stack.
#
# `template-file-path` is resolved by Git sync RELATIVE TO THE REPO ROOT,
# not relative to this file's own directory (confirmed the hard way while
# setting up the main ecs-bluegreen-lab stack -- see git history on
# ../deployment-file.yaml). Must be the full path from the repo root.

template-file-path: ecs-fargate-bluegreen-cicd-lab/infra/cfn/bootstrap/00-bootstrap.yaml

parameters:
  ProjectName: ecs-bluegreen-lab
  GitHubOrg: 1MuhireDavid
  RepoName: aws-labs
  AllowedGitRef: refs/heads/main
  InfraPackagingWorkflowFile: ecs-bluegreen-lab-infra-package-templates.yml
  AppBuildWorkflowFile: ecs-bluegreen-lab-app-build-and-push.yml
  InfraDeployWorkflowFile: ecs-bluegreen-lab-infra-deploy.yml
  # Confirmed in the AWS console: token.actions.githubusercontent.com
  # already exists in this account (13+ days old, predates this stack --
  # created by another lab, e.g. ecr-oidc-lab). "false" so this stack
  # doesn't try to create a duplicate.
  CreateOidcProvider: "false"

tags:
  Project: ecs-bluegreen-lab
  ManagedBy: CloudFormation-GitSync
  Environment: lab
