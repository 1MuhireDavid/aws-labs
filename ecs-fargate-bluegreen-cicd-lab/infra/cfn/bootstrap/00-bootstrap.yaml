AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bootstrap stack for the ECS Blue/Green CI/CD lab (monorepo edition).
  Deployed ONCE, manually, before Git sync takes ownership of the rest of
  the stacks. Creates the S3 bucket that hosts nested CFN templates, the
  GitHub OIDC provider, and two OIDC roles -- one for the infra-packaging
  workflow, one for the app build/push workflow. Both workflows live in
  the same repo, so each role's trust policy also checks GitHub's
  job_workflow_ref claim to keep them isolated from each other. See
  infra/README.md for the full explanation.

Parameters:
  ProjectName:
    Type: String
    Default: ecs-bluegreen-lab
    Description: Prefix used for all resource names/tags in this lab.

  GitHubOrg:
    Type: String
    Description: GitHub org or username that owns the repo (e.g. "1MuhireDavid").

  RepoName:
    Type: String
    Default: aws-labs
    Description: Name of the shared GitHub repo all labs (including this one) live in.

  AllowedGitRef:
    Type: String
    Default: "refs/heads/main"
    Description: Git ref allowed to assume the OIDC roles (branch protection boundary).

  InfraPackagingWorkflowFile:
    Type: String
    Default: ecs-bluegreen-lab-infra-package-templates.yml
    Description: Filename (under repo-root .github/workflows/) of the infra packaging workflow.

  AppBuildWorkflowFile:
    Type: String
    Default: ecs-bluegreen-lab-app-build-and-push.yml
    Description: Filename (under repo-root .github/workflows/) of the app build/push workflow.

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to "false" if the token.actions.githubusercontent.com OIDC provider
      already exists in this AWS account (only one is allowed per account --
      likely already true if other labs in this repo set up OIDC first).

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:

  # ---------------------------------------------------------------------
  # S3 bucket that hosts nested CloudFormation template bodies. Root.yaml
  # references child templates here via TemplateURL. Versioned so we keep
  # a full history of every infra change independent of git (defense in
  # depth if the repo history is ever rewritten).
  # ---------------------------------------------------------------------
  TemplatesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-cfn-templates-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldTemplateVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-Bootstrap

  TemplatesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TemplatesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TemplatesBucket.Arn
              - !Sub "${TemplatesBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ---------------------------------------------------------------------
  # GitHub OIDC provider (singleton per account -- if another lab in this
  # same aws-labs repo already created it, set CreateOidcProvider=false)
  # ---------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # GitHub's OIDC token-signing thumbprint. AWS validates the TLS chain
      # itself for *.actions.githubusercontent.com providers; this value is
      # required by the resource schema but no longer used for validation.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # ---------------------------------------------------------------------
  # Role for the infra-packaging workflow. Scoped to (a) this exact repo
  # + branch AND (b) this exact workflow file -- the app build workflow,
  # even running from the same repo/branch, cannot assume this role.
  # ---------------------------------------------------------------------
  InfraPackagingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-gha-infra-packaging-role"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOrg}/${RepoName}:${AllowedGitRef}"
                "token.actions.githubusercontent.com:job_workflow_ref": !Sub "${GitHubOrg}/${RepoName}/.github/workflows/${InfraPackagingWorkflowFile}@${AllowedGitRef}"
      Policies:
        - PolicyName: PutNestedTemplates
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action: ["s3:ListBucket"]
                Resource: !GetAtt TemplatesBucket.Arn
              - Sid: ReadWriteTemplateObjects
                Effect: Allow
                Action: ["s3:PutObject", "s3:GetObject"]
                Resource: !Sub "${TemplatesBucket.Arn}/templates/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------
  # Role for the app build/push workflow. Scoped to (a) this exact repo
  # + branch AND (b) this exact workflow file, plus push-only ECR actions
  # on a single, named repository ARN.
  # ---------------------------------------------------------------------
  AppEcrPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-gha-ecr-push-role"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOrg}/${RepoName}:${AllowedGitRef}"
                "token.actions.githubusercontent.com:job_workflow_ref": !Sub "${GitHubOrg}/${RepoName}/.github/workflows/${AppBuildWorkflowFile}@${AllowedGitRef}"
      Policies:
        - PolicyName: EcrPushOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: "ecr:GetAuthorizationToken"
                Resource: "*"
              - Sid: EcrPushToSingleRepo
                Effect: Allow
                Action:
                  - "ecr:BatchCheckLayerAvailability"
                  - "ecr:PutImage"
                  - "ecr:InitiateLayerUpload"
                  - "ecr:UploadLayerPart"
                  - "ecr:CompleteLayerUpload"
                  - "ecr:BatchGetImage"
                  - "ecr:DescribeImages"
                  - "ecr:DescribeRepositories"
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-app"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  TemplatesBucketName:
    Value: !Ref TemplatesBucket
    Export:
      Name: !Sub "${ProjectName}-templates-bucket"

  InfraPackagingRoleArn:
    Value: !GetAtt InfraPackagingRole.Arn

  AppEcrPushRoleArn:
    Value: !GetAtt AppEcrPushRole.Arn
